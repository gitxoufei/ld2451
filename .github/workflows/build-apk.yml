
name: Build FogRadar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -oq FogRadar_GitHub_Cloud_Build.zip -d .
          ls -la
          find app -maxdepth 3 -type f | head -30

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK 35
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Build Debug APK
        run: |
          sed -i '/^import android.app.Activity$/a import android.app.AlertDialog' app/src/main/java/top/xfwork/fogradar/MainActivity.kt
          gradle :app:assembleDebug --no-daemon --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FogRadar-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
